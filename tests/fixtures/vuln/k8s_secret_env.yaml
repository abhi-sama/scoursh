# tests/fixtures/vuln/k8s_secret_env.yaml - true-positive fixture for
# IAC-K8S-SECRET_ENV-01: a plaintext credential literal in an env var.
apiVersion: v1
kind: Pod
metadata:
  name: secret-env-demo
spec:
  automountServiceAccountToken: false
  containers:
    - name: app
      image: registry.example.com/app:1.4.2
      imagePullPolicy: IfNotPresent
      securityContext:
        privileged: false
        runAsNonRoot: true
      env:
        - name: DB_PASSWORD
          value: "hunter2Strong!"
      resources:
        limits:
          cpu: "500m"
          memory: "256Mi"
        requests:
          cpu: "250m"
          memory: "128Mi"
