# tests/fixtures/iac/cloudformation/cloudformation_template.yaml - CloudFormation-shaped
# fixture (this ticket's acceptance criteria: "never fires on
# CloudFormation-shaped fixtures (AWSTemplateFormatVersion/AWS:: types), even
# where their file glob overlaps with Kubernetes manifests").
#
# Deliberately an ECS task definition, since that is the CFN resource whose
# properties come closest in vocabulary to a Kubernetes container spec
# (Image, Privileged, resource sizing) - the closest real adversarial case
# for a files-glob-only distinction, not a contrived one. Every field here
# is CloudFormation's own PascalCase; the pack's IAC-K8S-* patterns key on
# the Kubernetes API's lowerCamelCase spelling of the same concepts, and
# matching is case-sensitive (rules/RULE-FORMAT.md §8.2), so none of the
# eight checks match on vocabulary grounds alone. AWSTemplateFormatVersion is
# also present for the three absence checks' own belt-and-suspenders
# context-deny.
#
# The `ConfigResource` block below is the adversarial case that guard is
# actually for: a genuine `AWS::CloudFormation::Init` metadata block uses its
# OWN lowercase keys (`config`, `packages`, `files`, `commands`, ...) by AWS's
# own spec, unlike the PascalCase `Properties` used everywhere else in this
# template. `containers`/`image` here stand in for that lowercase vocabulary -
# a bare files-glob/case-sensitivity distinction would not stop the two
# ABSENCE checks (IAC-K8S-MISSING_RESOURCE_LIMITS-01, IAC-K8S-RUN_AS_ROOT-01)
# from firing on it, because an absence check matches on what is NOT nearby,
# not on the vocabulary of what its own anchor pattern matched (`^\s*"?image"?\s*:`
# and `^\s*"?containers"?\s*:` are both indifferent to CloudFormation vs.
# Kubernetes - only the `AWSTemplateFormatVersion|AWS::` context-deny tells
# them apart). This block is what pins that: dropping either check's
# CloudFormation context-deny reintroduces this exact false positive.
AWSTemplateFormatVersion: "2010-09-09"
Description: Example ECS service, not a Kubernetes manifest
Resources:
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: demo-task
      ContainerDefinitions:
        - Name: app
          Image: registry.example.com/app:latest
          Privileged: true
          Essential: true
          Memory: 512
          Cpu: 256
  ConfigResource:
    Type: AWS::CloudFormation::Init
    Metadata:
      AWS::CloudFormation::Init:
        config:
          containers:
            image: registry.example.com/sidecar:1.0
  ServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Action:
              - "sts:AssumeRole"
            Principal:
              Service:
                - ecs-tasks.amazonaws.com
