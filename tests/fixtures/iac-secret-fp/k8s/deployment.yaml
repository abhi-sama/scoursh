apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
    spec:
      containers:
        - name: api
          image: registry.invalid/api:1.4.2
          env:
            - name: LOG_LEVEL
              value: "info"
            - name: GITHUB_TOKEN  # [[N11]] is the line above (LOG_LEVEL, beside a secret name)
              valueFrom:
                secretKeyRef:
                  name: gh
                  key: token
            - name: DB_PASSWORD_FILE  # [[N12]] is the line below
              value: "/opt/app/secrets/db-password"
            - name: TOKEN_ISSUER  # [[N13]] is the line below
              value: "https://auth.vendor.invalid"
            - name: DB_PASSWORD  # [[P03]] is the line below
              value: "Tr0ub4dor3xK"
