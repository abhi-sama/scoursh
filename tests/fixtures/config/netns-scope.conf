# tests/fixtures/config/netns-scope.conf - fixture scope.conf for
# tests/suites/netns.sh (tools/run-in-netns.sh, docs/FOUNDATION.md tension 20).
#
# Every host below is a .example/.invalid literal or a documented
# non-routable literal (RFC 5737 TEST-NET blocks); nothing here is ever
# dialled for real outside the gated, capability-probed real-namespace case,
# which itself only ever targets RFC 5737 test-net addresses that are
# guaranteed to have no route.

id: netns-fixture-good
base-url: https://good.netns.fixture.example/app
allow-subdomains: false
notes: Resolves (via the stubbed resolver most cases use) to 93.184.216.34,
  a stand-in "real" address. The unit tests never actually dial it.

id: netns-fixture-literal
base-url: https://198.51.100.7/x
notes: An IPv4 literal (RFC 5737 TEST-NET-2) - exercises the
  "already-an-IP-literal, skip resolution" branch of
  _netns_collect_target_ips directly, with no resolver involved at all.

id: netns-fixture-v6
base-url: https://v6only.netns.fixture.example/x
notes: Resolves to an IPv6 address in the stub - exercises the "IPv6
  routing is out of scope for this tool" skip branch.

id: netns-fixture-unresolvable
base-url: https://unresolvable.netns.fixture.example/x
notes: The stub resolver refuses this host - exercises the
  "DNS resolution failed" skip branch.
