# tests/fixtures/config/netns-scope.conf - fixture scope.conf for
# tests/suites/netns.sh (tools/run-in-netns.sh, docs/FOUNDATION.md tension 20).
#
# Every host below is a .example/.invalid literal or a documented
# non-routable literal (RFC 5737 TEST-NET blocks for IPv4, RFC 3849's
# 2001:db8::/32 documentation prefix for IPv6); nothing here is ever
# dialled for real outside the gated, capability-probed real-namespace case,
# which itself only ever targets RFC 5737/RFC 3849 addresses that are
# guaranteed to have no route.

id: netns-fixture-good
base-url: https://good.netns.fixture.example/app
allow-subdomains: false
notes: Resolves (via the stubbed resolver most cases use) to 93.184.216.34,
  a stand-in "real" address. The unit tests never actually dial it.

id: netns-fixture-literal
base-url: https://198.51.100.7/x
notes: An IPv4 literal (RFC 5737 TEST-NET-2) - exercises the
  "already-an-IP-literal, skip resolution" branch of
  _netns_collect_target_ips directly, with no resolver involved at all.

id: netns-fixture-v6
base-url: https://v6only.netns.fixture.example/x
notes: Resolves (via the stubbed resolver) to 2001:db8::1, an RFC 3849
  documentation-prefix address - exercises the "hostname resolved to an
  IPv6 address, admit it into the IPv6 array" branch of
  _netns_collect_target_ips.

id: netns-fixture-v6-literal
base-url: https://[2001:db8::7]/x
notes: An IPv6 literal (RFC 3849 documentation prefix), bracketed the way
  an operator would actually write one in base-url - exercises the
  "already-an-IPv6-literal, no resolution attempted" branch directly, the
  IPv6 sibling of netns-fixture-literal above.

id: netns-fixture-dual-stack
base-url: https://good.netns.fixture.example/app
extra-host: [2001:db8::99]
notes: One target carrying BOTH an IPv4 address (via the same base-url
  hostname netns-fixture-good above resolves, through the same
  http_resolve_host cache) and an IPv6 extra-host - exercises that a
  single dual-stack target is admitted in BOTH families at once, with
  neither route standing in for the other (a dual-stack target must not be
  able to bypass containment over whichever family is left unconfigured).

id: netns-fixture-unresolvable
base-url: https://unresolvable.netns.fixture.example/x
notes: The stub resolver refuses this host - exercises the
  "DNS resolution failed" skip branch.
