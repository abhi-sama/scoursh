# tests/fixtures/config/http-scope.conf - fixture scope.conf for
# tests/suites/http.sh (lib/http.sh, docs/FOUNDATION.md tension 19).
#
# Every host below is a .example / .invalid literal or a documented
# non-routable literal; nothing here is ever dialled for real (the test
# suite stubs SCOURSH_HTTP_RESOLVE and SCOURSH_HTTP_TRANSPORT so no network
# call is ever attempted).

id: fixture-good
base-url: https://good.fixture.example/app
extra-host: internal.fixture.example
extra-host: still-good.fixture.example
extra-host: metadata.fixture.example
allow-subdomains: false
allow-private-addresses: false
notes: The main allow-listed target. internal.fixture.example is declared
  in scope but resolves to a loopback address in the test suite, so it
  exercises the resolution-pinning deny list without allow-private-addresses.
  metadata.fixture.example is declared in scope but resolves to the cloud
  metadata sentinel 169.254.169.254, so it exercises the same deny list via
  DNS rather than a literal (docs/FOUNDATION.md tension 19's own named case:
  "a hostname resolving to 169.254.169.254").

id: fixture-wide
base-url: https://wide.fixture.example/
allow-subdomains: true
notes: Exercises the allow-subdomains branch of the tuple match.

id: fixture-private
base-url: https://priv.fixture.example/
allow-private-addresses: true
notes: The one target that opts in to a private/loopback resolution result.

id: fixture-literal-denied
base-url: https://169.254.169.254/
allow-private-addresses: false
notes: An operator-authored literal-IP target whose own address is the
  deny-listed SSRF sentinel (an honest mistake: authorising a metadata
  endpoint directly, or a base-url copied off a target that later turned
  out to have an internal address). The scope-tuple compare matches this
  target for ANY numeric spelling of the same 32 bits (decimal / octal /
  hex / IPv4-embedded-IPv6), because normalisation canonicalises the host
  before the tuple compare ever runs - so a request built from a
  differently-spelled literal reaches the resolution-pinning deny list
  exactly like a request for the plainly-spelled address would, and the
  deny list must still refuse all of them.
