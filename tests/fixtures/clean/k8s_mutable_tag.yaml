# tests/fixtures/clean/k8s_mutable_tag.yaml - true-negative (safe equivalent) fixture
# for the same-named IAC-K8S-* check in tests/fixtures/vuln/k8s_mutable_tag.yaml.
# This file is also scanned wholesale by every other IAC-K8S-* check id
# (the whole tests/fixtures/clean tree is scanned as one unit), so nothing
# below may trip ANY of the eight checks in modules/iac/kubernetes.rules,
# not merely the one it is named for.
apiVersion: v1
kind: Pod
metadata:
  name: mutable-tag-demo
spec:
  hostNetwork: false
  hostPID: false
  automountServiceAccountToken: false
  containers:
    - name: app
      image: registry.example.com/app:1.4.2
      imagePullPolicy: IfNotPresent
      securityContext:
        privileged: false
        runAsNonRoot: true
      env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: password
      resources:
        limits:
          cpu: "500m"
          memory: "256Mi"
        requests:
          cpu: "250m"
          memory: "128Mi"
