# Database password sourced from a Secrets Manager dynamic reference,
# never a literal - safe equivalent for IAC-CFN-HARDCODED_SECRET-01.
AWSTemplateFormatVersion: '2010-09-09'
Resources:
  AppDatabase:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: postgres
      MasterUsername: appuser
      MasterUserPassword: '{{resolve:secretsmanager:app/db/password}}'
