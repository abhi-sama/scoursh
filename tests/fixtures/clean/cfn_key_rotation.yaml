# KMS key resource with automatic key rotation enabled - safe equivalent
# for IAC-CFN-KEY_ROTATION_DISABLED-01.
AWSTemplateFormatVersion: '2010-09-09'
Resources:
  AppKey:
    Type: AWS::KMS::Key
    Properties:
      Description: application data key
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
