# release: build, gate, attest and publish one immutable GitHub Release.
#
# DORMANT until a maintainer pushes a `vX.Y.Z` (or `vX.Y.Z-PRERELEASE`) tag.
# Nothing in this file runs on a branch push or a pull request.  A manual
# `workflow_dispatch` run is a DRY RUN: it builds the tarball and runs the
# release gate against whatever ref it was started on, uploads the result as
# a workflow artifact, and never attests, tags, or publishes anything.
#
# The flow (docs/USAGE.md, "Installing from a release", is the user-facing
# half of this):
#
#   build + macos-bash (read-only token, no OIDC)
#     1. the tag names a commit on main, and equals the VERSION file;
#     2. main's own `tests` workflow (ci.yml) finished GREEN for that exact
#        commit - a release never ships a commit CI did not pass, and this
#        job checks that fact rather than re-running the ~90 min suite;
#     3. tools/build-release.sh builds scoursh-VERSION.tar.gz + SHA256SUMS
#        (reproducible: anyone can rebuild at the tag and compare sha256);
#     4. tools/smoke-installed.sh - the release gate - extracts it read-only,
#        links it onto PATH, and proves --version, paths, and a real sast scan
#        all work from that installed layout.
#     5. macos-bash checksum-verifies Bash 5.3, builds an arm64+x86_64 binary
#        twice, refuses a non-identical rebuild, packages its COPYING plus
#        README, and proves the overlaid asset works with stock /bin/bash and
#        a deliberately failing PATH/bash.
#   publish (write token + OIDC; runs NO repository code at all)
#     6. re-checks all downloaded bytes and refuses to publish a macOS asset
#        without its upstream source, build script, and exact COPYING;
#     7. attests every release asset with GitHub artifact attestations (Sigstore,
#        SLSA build provenance);
#     8. creates the release as a DRAFT with all assets, then publishes it -
#        with the repository's "immutable releases" setting on, publishing
#        locks the tag and the assets;
#     9. fails loudly if the published release is not immutable.
#   homebrew (tap-only token; reads template bytes but runs no repository code)
#    10. renders the Homebrew formula using the build job's already-attested
#        checksum, writes it on a tap branch, and opens (or reuses) a tap PR.
#
# The split is least privilege: the job that executes repository code (the
# build and a full scan) holds no write token and no id-token, and the job
# holding them executes nothing from the repository.
#
# The Homebrew job is deliberately after publication: it uses the SHA-256 that
# the build job emitted, rather than downloading public release bytes to hash
# them again.  It needs the `HOMEBREW_TAP_TOKEN` Actions secret: a fine-grained
# token limited to abhi-sama/homebrew-scoursh with Contents read/write and
# Pull requests read/write.  The repository GITHUB_TOKEN cannot write a
# sibling repository.  The job refuses clearly when that prerequisite is
# absent; it never falls back to a broader credential.
#
# Every `uses:` is pinned to a full commit SHA (the trailing comment names
# the release it was resolved from); a tag can be moved, a commit cannot.
#
# Maintainer prerequisites (repository settings, not code): enable immutable
# releases; restrict who may create `v*` tags (a tag ruleset); optionally add
# a required reviewer to the `release` environment for a one-click approval
# before anything is published.

name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.id.outputs.version }}
      sha256: ${{ steps.pkg.outputs.sha256 }}
      prerelease: ${{ steps.id.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Identify the release (tag == VERSION, commit on main)
        id: id
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          file_version=$(cat VERSION)
          if [[ $EVENT == push ]]; then
            version=${GITHUB_REF_NAME#v}
            if [[ $file_version != "$version" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($file_version)"
              exit 1
            fi
            tagged=$(git rev-parse "$GITHUB_REF^{commit}")
            if [[ $tagged != "$GITHUB_SHA" ]]; then
              echo "::error::tag $GITHUB_REF_NAME resolves to $tagged, not the triggering $GITHUB_SHA"
              exit 1
            fi
            git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
              echo "::error::$GITHUB_SHA is not on main; releases are cut from main only"
              exit 1
            fi
          else
            version=$file_version
            echo "::notice::workflow_dispatch dry run of $GITHUB_REF at $GITHUB_SHA (VERSION $version): nothing will be attested or published"
          fi
          # Strict SemVer, checked HERE because every later step interpolates
          # it; a tag name may legally carry shell metacharacters.
          if [[ ! $version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not MAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          fi
          prerelease=false
          [[ $version == *-* ]] && prerelease=true
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >>"$GITHUB_OUTPUT"

      - name: main's CI passed for this exact commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The newest completed push-to-main run of ci.yml for this SHA must
          # have concluded `success`; no run at all is a refusal too (a commit
          # that was never a main tip was never tested as one).
          conclusion=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push&status=completed&per_page=50" \
            --jq '[.workflow_runs[]] | sort_by(.created_at) | last | .conclusion // "none"')
          if [[ $conclusion != success ]]; then
            echo "::error::main's tests workflow for $GITHUB_SHA concluded '$conclusion', not 'success' - refusing to release"
            exit 1
          fi
          echo "main's tests workflow passed for $GITHUB_SHA"

      - name: Build the tarball and SHA256SUMS
        id: pkg
        env:
          VERSION: ${{ steps.id.outputs.version }}
        run: tools/build-release.sh "$VERSION" dist

      - name: Release gate - run it as a read-only installed copy
        env:
          VERSION: ${{ steps.id.outputs.version }}
        run: tools/smoke-installed.sh "dist/scoursh-$VERSION.tar.gz"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: |
            dist/scoursh-${{ steps.id.outputs.version }}.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  macos-bash:
    # The companion binary needs Apple's SDK, lipo, otool, and codesign. This
    # job has no write or OIDC credential; workflow_dispatch uploads a dry-run
    # artifact only because publish remains push-tag-only below.
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Identify the companion asset version
        id: id
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          if [[ $EVENT == push ]]; then
            tag_version=${GITHUB_REF_NAME#v}
            if [[ $tag_version != "$version" ]]; then
              echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($version)"
              exit 1
            fi
          else
            echo "::notice::workflow_dispatch dry run of macOS Bash asset for $GITHUB_REF (VERSION $version): nothing will be attested or published"
          fi
          if [[ ! $version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not MAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Fetch the exact Bash 5.3 source
        run: |
          set -euo pipefail
          mkdir -p dist
          curl -fsSL --retry 3 https://ftp.gnu.org/gnu/bash/bash-5.3.tar.gz -o dist/bash-5.3.tar.gz

      - name: Build and prove the universal Bash is reproducible
        env:
          VERSION: ${{ steps.id.outputs.version }}
        run: |
          set -euo pipefail
          tools/build-macos-bash.sh --verify-reproducible dist/bash-5.3.tar.gz \
            "dist/macos-bash/scoursh-$VERSION/libexec/bash"
          tools/package-macos-bash.sh dist/bash-5.3.tar.gz \
            "dist/macos-bash/scoursh-$VERSION/libexec/bash" "$VERSION" dist

      - name: Release gate - prove the companion works on stock Bash discovery
        env:
          VERSION: ${{ steps.id.outputs.version }}
        run: |
          set -euo pipefail
          # build-release.sh sources lib/core.sh, so it needs the just-built
          # Bash too. Starting it directly would use stock macOS /bin/bash
          # and abort before the smoke gate gets a chance to exercise scan.sh.
          "dist/macos-bash/scoursh-$VERSION/libexec/bash" tools/build-release.sh "$VERSION" dist
          "dist/macos-bash/scoursh-$VERSION/libexec/bash" tools/smoke-macos-bash.sh \
            "dist/scoursh-$VERSION.tar.gz" "dist/scoursh-$VERSION-macos-bash.tar.gz" "$VERSION"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-bash-dist
          path: |
            dist/scoursh-${{ steps.id.outputs.version }}-macos-bash.tar.gz
            dist/macos-bash-SHA256SUMS
            dist/bash-5.3.tar.gz
            dist/build-macos-bash.sh
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [build, macos-bash]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-bash-dist
          path: dist

      - name: The bytes are the ones the build job hashed
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          cd dist
          printf '%s  %s\n' "$SHA256" "scoursh-$VERSION.tar.gz" | sha256sum -c -
          sha256sum -c SHA256SUMS
          sha256sum -c macos-bash-SHA256SUMS

      - name: GPL companion completeness - source, build script, and exact license
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          macos_asset="scoursh-$VERSION-macos-bash.tar.gz"
          for required in "$macos_asset" bash-5.3.tar.gz build-macos-bash.sh macos-bash-SHA256SUMS; do
            [[ -f $required ]] || { echo "::error::required macOS Bash release material is absent: $required"; exit 1; }
          done
          python3 - "$macos_asset" bash-5.3.tar.gz "$VERSION" <<'PY'
          import sys, tarfile
          asset, source, version = sys.argv[1:]
          prefix = 'scoursh-%s/' % version
          required = {prefix + 'libexec/bash', prefix + 'COPYING', prefix + 'README-bash.txt'}
          with tarfile.open(asset, 'r:gz') as companion:
              members = {member.name: member for member in companion.getmembers()}
              missing = sorted(required - set(members))
              if missing:
                  raise SystemExit('::error::macOS Bash asset is missing: ' + ', '.join(missing))
              if not members[prefix + 'libexec/bash'].mode & 0o111:
                  raise SystemExit('::error::macOS Bash asset has a non-executable libexec/bash')
              copying = companion.extractfile(prefix + 'COPYING').read()
              readme = companion.extractfile(prefix + 'README-bash.txt').read()
          with tarfile.open(source, 'r:gz') as upstream:
              upstream_copying = upstream.extractfile('bash-5.3/COPYING').read()
          if copying != upstream_copying:
              raise SystemExit('::error::companion COPYING differs from bash-5.3/COPYING')
          if b'GPLv3 or later' not in readme or b'not notarized' not in readme:
              raise SystemExit('::error::companion README-bash.txt lacks its GPL or notarization notice')
          PY

      - name: Attest (Sigstore, SLSA build provenance)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/scoursh-${{ needs.build.outputs.version }}.tar.gz
            dist/SHA256SUMS
            dist/scoursh-${{ needs.build.outputs.version }}-macos-bash.tar.gz
            dist/macos-bash-SHA256SUMS
            dist/bash-5.3.tar.gz
            dist/build-macos-bash.sh

      - name: Publish the release (draft, then published so it locks)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA256: ${{ needs.build.outputs.sha256 }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          tag=$GITHUB_REF_NAME
          macos_bash_sha=$(awk -v name="scoursh-$VERSION-macos-bash.tar.gz" '$2 == name {print $1}' dist/macos-bash-SHA256SUMS)
          [[ $macos_bash_sha =~ ^[0-9a-f]{64}$ ]] || { echo '::error::macOS Bash SHA-256 is missing'; exit 1; }
          cat >notes.md <<EOF
          scoursh $VERSION

          | asset | sha256 |
          |---|---|
          | \`scoursh-$VERSION.tar.gz\` | \`$SHA256\` |
          | \`scoursh-$VERSION-macos-bash.tar.gz\` | \`$macos_bash_sha\` |

          Verify before installing (see docs/USAGE.md, "Installing from a release"):

          \`\`\`sh
          sha256sum -c SHA256SUMS        # or: shasum -a 256 -c SHA256SUMS
          sha256sum -c macos-bash-SHA256SUMS
          gh attestation verify scoursh-$VERSION.tar.gz --repo $GITHUB_REPOSITORY \\
            --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml
          gh release verify $tag --repo $GITHUB_REPOSITORY
          \`\`\`

          The advisory database is not bundled; build it once after installing
          (\`scoursh-vendor advisories bulk --all --accept-unverified\`).
          EOF
          flags=(--draft --verify-tag --title "scoursh $VERSION" --notes-file notes.md)
          if [[ $PRERELEASE == true ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" "${flags[@]}" \
            "dist/scoursh-$VERSION.tar.gz" dist/SHA256SUMS \
            "dist/scoursh-$VERSION-macos-bash.tar.gz" dist/macos-bash-SHA256SUMS \
            dist/bash-5.3.tar.gz dist/build-macos-bash.sh
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: The published release is immutable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          immutable=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isImmutable --jq .isImmutable)
          if [[ $immutable != true ]]; then
            echo "::error::release $GITHUB_REF_NAME is published but NOT immutable - enable 'immutable releases' in the repository settings before tagging"
            exit 1
          fi
          gh release verify "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"

  homebrew:
    # This runs only after publication: it is an advisory tap PR, never part
    # of the immutable release itself.  Do not check out the release commit or
    # run its code with a credential that can write the sibling tap.
    needs: [build, publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      - name: Render and propose the Homebrew formula bump
        env:
          SOURCE_GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          tap=abhi-sama/homebrew-scoursh
          tap_owner=${tap%%/*}
          branch=release-scoursh-$VERSION

          if [[ -z ${HOMEBREW_TAP_TOKEN:-} ]]; then
            echo '::error::HOMEBREW_TAP_TOKEN is required to open the Homebrew tap PR; grant it only Contents and Pull requests read/write on abhi-sama/homebrew-scoursh'
            exit 1
          fi
          [[ $VERSION =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::unsafe release version: $VERSION"; exit 1;
          }
          [[ $SHA256 =~ ^[0-9a-f]{64}$ ]] || {
            echo '::error::build job did not provide a lowercase SHA-256'; exit 1;
          }

          # Fetch the template as data at the tagged commit. The tap-write
          # credential never checks out or executes files from this repository.
          GH_TOKEN="$SOURCE_GH_TOKEN" gh api \
            "repos/$GITHUB_REPOSITORY/contents/packaging/homebrew/scoursh.rb?ref=$GITHUB_SHA" \
            --jq .content | tr -d '\n' | base64 --decode > formula.template.rb
          python3 - formula.template.rb Formula.scoursh.rb "$VERSION" "$SHA256" <<'PY'
          from pathlib import Path
          import re
          import sys

          source, destination, version, digest = sys.argv[1:]
          template = Path(source).read_text(encoding="utf-8")
          if template.count("@VERSION@") != 2 or template.count("@SHA256@") != 1:
              raise SystemExit("::error::Homebrew template marker contract changed")
          # RELEASE_JOB comments guide template authors. The rendered tap
          # formula instead carries concise provenance for formula readers.
          lines = [line for line in template.splitlines()
                   if not line.lstrip().startswith("# RELEASE_JOB:")]
          if not lines or lines[0] != "class Scoursh < Formula":
              raise SystemExit("::error::Homebrew template must start with its formula class")
          lines[1:1] = [
              "  # Rendered from packaging/homebrew/scoursh.rb in abhi-sama/scoursh at each release.",
              "  # Edit it there, not here.",
          ]
          rendered = "\n".join(lines).replace("@VERSION@", version).replace("@SHA256@", digest) + "\n"
          if "@VERSION@" in rendered or "@SHA256@" in rendered:
              raise SystemExit("::error::Homebrew template rendering left a marker behind")
          if "RELEASE_JOB:" in rendered:
              raise SystemExit("::error::Homebrew formula leaked template-only instructions")
          expected = f"scoursh-{version}.tar.gz"
          if expected not in rendered or not re.search(rf'^  sha256 "{digest}"$', rendered, re.M):
              raise SystemExit("::error::Homebrew formula rendering failed its release contract")
          Path(destination).write_text(rendered, encoding="utf-8")
          PY

          # A rerun reuses its deterministic branch and PR rather than opening
          # a duplicate. The branch is based on the tap's then-current main.
          branch_sha=$(GH_TOKEN="$HOMEBREW_TAP_TOKEN" gh api \
            "repos/$tap/git/ref/heads/$branch" --jq .object.sha 2>/dev/null || true)
          if [[ -z $branch_sha ]]; then
            main_sha=$(GH_TOKEN="$HOMEBREW_TAP_TOKEN" gh api \
              "repos/$tap/git/ref/heads/main" --jq .object.sha)
            GH_TOKEN="$HOMEBREW_TAP_TOKEN" gh api POST "repos/$tap/git/refs" \
              --field "ref=refs/heads/$branch" --field "sha=$main_sha" >/dev/null
          fi

          formula_sha=$(GH_TOKEN="$HOMEBREW_TAP_TOKEN" gh api \
            "repos/$tap/contents/Formula/scoursh.rb?ref=$branch" --jq .sha)
          rendered_b64=$(base64 < Formula.scoursh.rb | tr -d '\n')
          current_b64=$(GH_TOKEN="$HOMEBREW_TAP_TOKEN" gh api \
            "repos/$tap/contents/Formula/scoursh.rb?ref=$branch" --jq .content | tr -d '\n')
          if [[ $current_b64 != "$rendered_b64" ]]; then
            # The commit message is derived from VERSION only after strict
            # SemVer validation above; it is not user-controlled input.
            python3 - request.json "$branch" "$formula_sha" "$rendered_b64" "$VERSION" <<'PY'
          import json
          import sys
          out, branch, sha, content, version = sys.argv[1:]
          with open(out, "w", encoding="utf-8") as stream:
              json.dump({"message": f"scoursh {version}", "branch": branch,
                         "sha": sha, "content": content}, stream)
          PY
            GH_TOKEN="$HOMEBREW_TAP_TOKEN" gh api PUT \
              "repos/$tap/contents/Formula/scoursh.rb" --input request.json >/dev/null
          fi

          pr_url=$(GH_TOKEN="$HOMEBREW_TAP_TOKEN" gh api \
            "repos/$tap/pulls?head=$tap_owner:$branch&state=open" \
            --jq '.[0].html_url // empty')
          if [[ -z $pr_url ]]; then
            pr_url=$(GH_TOKEN="$HOMEBREW_TAP_TOKEN" gh pr create --repo "$tap" \
              --base main --head "$branch" --title "scoursh $VERSION" \
              --body "Automated formula bump for published scoursh v$VERSION.\n\nThe SHA-256 comes from the source release build job; this job does not re-download and re-hash the release asset.")
          fi
          echo "Homebrew formula PR: $pr_url"
