# docs/FOUNDATION.md tension 24: the suite runs on Linux with GNU coreutils AND
# on macOS with a BSD userland, because that is what turns "one capability
# layer" from a list of good intentions into a checked property.  Several of the
# shell facts this repository depends on differ between the two, and every one
# of them was found by running the command rather than by reasoning about it.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            userland: GNU coreutils
          - os: macos-latest
            userland: BSD
    # The repository is PUBLIC, so this evaluates true and the job runs for
    # real. The guard is kept rather than deleted: on a private repository
    # hosted Actions cannot start a run here at all (a billing condition,
    # docs/CI-RUNBOOK.md), and without this the job would fail with zero steps
    # and a red X that has nothing to do with the code. It keeps the workflow
    # safe to carry in a fork, or if this repository is ever made private
    # again.
    if: ${{ !github.event.repository.private }}
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} (${{ matrix.userland }})
    steps:
      - uses: actions/checkout@v4

      # macOS ships bash 3.2, which has no associative arrays; tension 24
      # freezes the minimum at 4.2.
      - name: Install a bash that meets the frozen minimum
        if: runner.os == 'macOS'
        run: brew install bash

      # PIN THE EXACT shellcheck VERSION, AND PIN IT ON BOTH LEGS.
      #
      # This used to be `apt-get install shellcheck` on Linux and `brew install
      # shellcheck` on macOS, which is two different versions on the two legs
      # and a third one on whatever a contributor has locally. The whole-tree
      # stage's verdict is not version-stable, so that made a red CI check
      # unactionable: the first run that got far enough to reach a verdict
      # reported 56 findings across 18 files on `ubuntu-latest`
      # (SC2317 x23, SC2119 x21, SC2002 x6, SC2120 x4, SC2015 x2) while
      # `macos-latest` and every local run over the identical tree reported
      # none. Measured directly rather than inferred: shellcheck 0.9.0 (what
      # Ubuntu's apt ships) reports SC2120 on lib/state.sh and SC2119/SC2120
      # on modules/dast/run.sh, and 0.11.0 reports nothing on either. SC2317
      # ("command appears unreachable") is the bulk of it and is exactly the
      # check this codebase provokes by design, since traps and the
      # SCOURSH_HTTP_TRANSPORT / SCOURSH_PARANOID_* seams invoke functions
      # indirectly; later releases narrowed it.
      #
      # The official release tarball is used rather than a package manager
      # because it is the only source that gives the SAME binary on both
      # runners. Nothing here is scan-time network access - docs/DESIGN.md
      # §9's rule is about a scan, and this is CI provisioning.
      #
      # The version is printed, and the stage prints it too, so a future skew
      # is visible in the log instead of being inferred from the findings.
      - name: Install shellcheck (pinned)
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          set -euo pipefail
          case "$RUNNER_OS-$(uname -m)" in
            Linux-x86_64)  plat=linux.x86_64 ;;
            Linux-aarch64) plat=linux.aarch64 ;;
            macOS-arm64)   plat=darwin.aarch64 ;;
            macOS-x86_64)  plat=darwin.x86_64 ;;
            *) echo "no pinned shellcheck build mapped for $RUNNER_OS-$(uname -m)" >&2; exit 1 ;;
          esac
          url="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.${plat}.tar.xz"
          curl -fsSL --retry 3 "$url" -o "$RUNNER_TEMP/shellcheck.tar.xz"
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/sc-bin"
          install -m 0755 "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" "$RUNNER_TEMP/sc-bin/shellcheck"
          # Prepended via GITHUB_PATH rather than installed into /usr/local/bin,
          # so this wins over any shellcheck the runner image already ships
          # whatever order the image happens to put directories in.
          echo "$RUNNER_TEMP/sc-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/sc-bin/shellcheck" --version

      - name: Confirm the pinned shellcheck is the one on PATH
        run: |
          set -euo pipefail
          command -v shellcheck
          shellcheck --version
          shellcheck --version | grep -qx 'version: 0.11.0'

      - name: Report the userland
        run: |
          set -x
          bash --version | head -1
          /opt/homebrew/bin/bash --version 2>/dev/null | head -1 || true
          grep --version 2>&1 | head -1 || true
          command -v shred || echo 'no shred (expected on macOS)'
          command -v rg || echo 'no ripgrep'

      # The whole-tree `shellcheck` stage now runs ONE invocation per file, so
      # its peak is the MAX over the tree rather than the SUM over a batch.
      # That max is the number that decides whether the stage fits a runner at
      # all, so publish it per runner rather than inferring it from a
      # contributor's laptop.  `tests/suites/dast-methods.sh` is the tree's
      # heaviest entry point (hub sum 17, the cap in
      # tests/lint-source-graph.sh).  This step can never fail the job: it is
      # a measurement, not an assertion, and a runner image without
      # `/usr/bin/time` must not turn that into a red X.
      - name: Measure peak shellcheck -x RSS for the tree's heaviest file
        continue-on-error: true
        run: |
          f=tests/suites/dast-methods.sh
          if ! command -v /usr/bin/time >/dev/null 2>&1; then
            echo "no /usr/bin/time on this image - skipping the measurement"; exit 0
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            # BSD `time -l` reports maximum RSS in BYTES, in field 1.
            /usr/bin/time -l shellcheck -x -s bash "$f" 2>&1 \
              | awk '/maximum resident set size/ {printf "%s: peak RSS %.2f GB\n", "'"$f"'", $1/1024/1024/1024}'
          else
            # GNU `time -v` reports it in KILOBYTES, in field 6.
            /usr/bin/time -v shellcheck -x -s bash "$f" 2>&1 \
              | awk '/Maximum resident set size/ {printf "%s: peak RSS %.2f GB\n", "'"$f"'", $6/1024/1024}'
          fi
          echo "--- runner memory for comparison:"
          if [ -r /proc/meminfo ]; then grep -E 'MemTotal|MemAvailable' /proc/meminfo; else
            sysctl -n hw.memsize | awk '{printf "hw.memsize: %.1f GB\n", $1/1024/1024/1024}'
          fi

      - name: Run the suite
        run: |
          BASH=bash
          for candidate in /opt/homebrew/bin/bash /usr/local/bin/bash; do
            [ -x "$candidate" ] && BASH=$candidate && break
          done
          set -o pipefail
          "$BASH" tests/run-tests.sh 2>&1 | tee suite.log

      # The job log is only readable through an API that truncates, and a
      # failure summary lives at the END of the run, so the log is kept as an
      # artifact whatever the outcome.
      - name: Keep the suite log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-log-${{ matrix.os }}
          path: suite.log
          if-no-files-found: warn

      - name: Emit the fixture scan for cross-userland comparison
        run: |
          BASH=bash
          for candidate in /opt/homebrew/bin/bash /usr/local/bin/bash; do
            [ -x "$candidate" ] && BASH=$candidate && break
          done
          "$BASH" tests/e2e/fixture-scan.sh "$RUNNER_TEMP/run"
          # The run timestamp is the only value that legitimately differs between
          # two runs; everything else must be byte-identical across userlands.
          sed -e 's/"first_seen":"[^"]*"/"first_seen":"T"/g' \
              -e 's/"last_seen":"[^"]*"/"last_seen":"T"/g' \
              "$RUNNER_TEMP/run/findings.jsonl" > findings.normalised.jsonl
          wc -l findings.normalised.jsonl

      - uses: actions/upload-artifact@v4
        with:
          name: findings-${{ matrix.os }}
          path: findings.normalised.jsonl

  compare:
    # tension 24's actual requirement: the suite fails if a finding, a
    # fingerprint, or a findings.jsonl byte differs between the two userlands.
    needs: suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: findings-ubuntu-latest, path: gnu }
      - uses: actions/download-artifact@v4
        with: { name: findings-macos-latest, path: bsd }
      - name: Assert byte-identical findings across GNU and BSD userlands
        run: diff -u gnu/findings.normalised.jsonl bsd/findings.normalised.jsonl
