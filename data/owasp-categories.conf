# scoursh OWASP Top 10 category labels - rules/RULE-FORMAT.md §9.6.6
#
# COMPLIANCE-01 (docs/STEP10-SARIF-PLAN.md Track B): rules/RULE-FORMAT.md §9.1's
# `owasp` field row promises "the report expands it to the full label" and
# nothing implemented that until this file.  As DATA, not a compiled `case`,
# for the same reason data/severity-rubric.conf is: it is reviewable and
# diffable against the published standard rather than buried in a script.
#
# Covers the OWASP Top 10 2021 edition (https://owasp.org/Top10/), the set
# docs/DESIGN.md Appendix B names and every id `E026`'s
# ^(A[0-9]{2}:[0-9]{4}|none)$ pattern admits from that edition.  `none` is
# NOT a row here - it is a fixed literal meaning "this check maps to no
# OWASP category", handled directly by the report layer (lib/report.sh),
# never looked up in this table.
#
# An `owasp` id this table has no row for (a different edition's id, or a
# typo that still matches E026's pattern) is a real gap: the report layer
# renders the bare id plus a recorded reason rather than inventing a label
# or silently dropping the category, per COMPLIANCE-01's own acceptance
# criteria.  Refreshing this file for a future OWASP Top 10 edition is a
# matter of adding that edition's ten records; nothing here is inferred from
# the id string itself.

id: A01:2021
category: Broken Access Control
format-version: 1

id: A02:2021
category: Cryptographic Failures

id: A03:2021
category: Injection

id: A04:2021
category: Insecure Design

id: A05:2021
category: Security Misconfiguration

id: A06:2021
category: Vulnerable and Outdated Components

id: A07:2021
category: Identification and Authentication Failures

id: A08:2021
category: Software and Data Integrity Failures

id: A09:2021
category: Security Logging and Monitoring Failures

id: A10:2021
category: Server-Side Request Forgery (SSRF)
