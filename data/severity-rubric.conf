# scoursh severity rubric - rules/RULE-FORMAT.md §9.6.5
#
# The frozen modifier table of docs/FOUNDATION.md tension 8, as DATA so it is
# reviewable and diffable rather than buried in code.
#
#   final = clamp( base + sum(modifiers), floor, ceiling )
#
# The rubric ALWAYS runs, reads nothing outside the finding record, and is total:
# a fact absent from a finding takes its documented default, so severity never
# depends on whether a module bothered to set a field.
#
#   exposure          default `unknown`
#   auth              default `user`
#   sensitive-data    default `false`
#   confidence        default `medium`
#
# No two records may share a (fact, equals) pair (E075): that would make the sum
# order-dependent.

id: exposure-internet
format-version: 1
fact: exposure
equals: internet
modifier: +1

id: exposure-internal
fact: exposure
equals: internal
modifier: -1

id: exposure-unknown
fact: exposure
equals: unknown
modifier: 0

id: auth-none
fact: auth
equals: none
modifier: +1

id: auth-user
fact: auth
equals: user
modifier: 0

id: auth-admin
fact: auth
equals: admin
modifier: -1

id: sensitive-data-true
fact: sensitive-data
equals: true
modifier: +1

id: sensitive-data-false
fact: sensitive-data
equals: false
modifier: 0

id: confidence-low
fact: confidence
equals: low
modifier: -1

id: confidence-medium
fact: confidence
equals: medium
modifier: 0

id: confidence-high
fact: confidence
equals: high
modifier: 0
