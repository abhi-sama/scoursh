# tools/dast-test-target/scope.conf - rules/RULE-FORMAT.md §9.4
#
# Authorizes exactly ONE target: the local, operator-started OWASP Juice
# Shop container tools/dast-test-target.sh manages, on 127.0.0.1 at the
# fixed port SCOURSH_DAST_TEST_TARGET_PORT defaults to (3400).
#
# This is a TEST FIXTURE, not a shipped default: it is never installed as
# config/scope.conf and no application/company/product name from a real
# engagement appears anywhere in this repository (docs/DESIGN.md §1). Juice
# Shop is named here only because it is the target itself - a deliberately
# vulnerable, operator-owned local sandbox - not a scanned third party. See
# docs/DAST-TEST-TARGET-AUTHORIZATION.md for the authorization record.
#
# allow-private-addresses: true is required: 127.0.0.0/8 is in lib/http.sh's
# resolution-pinning deny list (docs/FOUNDATION.md tension 19) and this
# target is loopback by design - it never leaves the operator's own machine.

id: dast-test-target
base-url: http://127.0.0.1:3400/
allow-subdomains: false
allow-private-addresses: true
notes: Local-only OWASP Juice Shop container started by
  tools/dast-test-target.sh for exercising the DAST scope gate and, once
  modules/dast/ lands (docs/STEP5-DAST-PLAN.md), DAST checks themselves
  end to end, including broken-access-control checks between the two test
  identities tools/dast-test-identities.sh provisions. Operator-owned,
  local, and authorized - never a real operator's endpoint.
