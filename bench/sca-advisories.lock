# bench/sca-advisories.lock - pinned OSV.dev advisories for the SCA
# detection-benchmark leg (B5).  Read by bench/fetch-sca-corpus.sh, which
# turns this into bench/corpora/_samples/sca-lockfiles-26/{root,truth,MANIFEST}
# - a real npm/PyPI/Go lockfile per case, pinned to a genuinely vulnerable
# version (the `real: true` case) or the first version OSV says is not
# vulnerable (the `real: false` sanitized-trap counterpart), exactly the
# real/trap pairing bench/corpus.lock's owasp-benchmark record uses for SAST
# and for the identical reason (bench/lib/truth.sh's header: a recall-only
# corpus cannot measure a false-positive rate, and Youden J needs one).
#
# EVERY FACT BELOW WAS READ FROM https://api.osv.dev/v1/vulns/<osv-id> AT THE
# `resolved` TIMESTAMP, NOT FROM MEMORY.  `fixed-version` is not "the first
# `fixed` event in the document" - a single OSV record routinely carries
# several SEMVER ranges (one per affected release branch: minimist's
# GHSA-xvch-5gv4-984h has a 0.x range fixed at 0.2.4 *and* a 1.x range fixed
# at 1.2.6), and the one that matters is whichever range actually contains
# `vuln-version`.  Picking the wrong one is silent and wrong in the direction
# that inflates a tool's apparent miss: a "fixed" case built from the wrong
# range asks a scanner to explain a version gap the advisory never claimed.
#
# THIS IS A CONSTRUCTED CORPUS, NOT A CLONED ONE - unlike owasp-benchmark and
# terragoat in bench/corpus.lock, there is no single third-party "SCA
# benchmark" repository to pin a commit against.  Every case here names a
# real, historically shipped, publicly disclosed vulnerable version of a real
# package, and the corpus this file drives out of it is licence-free (it
# vendors no third-party test code, only package names and version numbers),
# so - unlike the git-cloned corpora - it is small enough to fetch offline
# from this file alone and IS reproducible without network access; the
# default fetch additionally re-verifies each id live (see
# bench/fetch-sca-corpus.sh --offline to skip that and build from the pin
# alone).
#
# scoursh's OWN advisory_id for a real (non-fixture) database is the OSV
# canonical id (tools/vendor-engines.sh's `rows_for()`: `vuln_id =
# data.get("id")`), never a CVE, so `osv-id` below - not `cve` - is what
# scoursh and OSV-Scanner (which also speaks OSV natively) are expected to
# report back; `cve` is recorded because Trivy and Grype more often surface
# it instead, and both are read for the STRICT (identity) scoring column.
#
# FORMAT: the same blank-line-separated `key: value` block shape
# bench/corpus.lock uses (rules/RULE-FORMAT.md's frozen record shape,
# deliberately not loaded by the scanner - see that file's own header).
#
# KEYS
#   id             this file's own case-family id; becomes the case directory
#                  name under bench/corpora/_samples/sca-lockfiles-26/root/
#   ecosystem      the OSV ecosystem string (npm, PyPI, Go)
#   package        the package name, OSV's own spelling
#   vuln-version   a real, historically shipped vulnerable version
#   fixed-version  the first version NOT in the SEMVER range that actually
#                  contains vuln-version (see the header paragraph above)
#   osv-id         the advisory this pair was resolved from
#   cve            its CVE alias, or empty if OSV lists none
#   severity       OSV's own database_specific.severity, verbatim
#   resolved       UTC timestamp this record was read from the live API
#   summary        OSV's own one-line summary, verbatim
#   note           free prose, repeatable

