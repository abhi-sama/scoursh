# bench/cwe-classes.conf - the CWE equivalence classes STRICT matching uses.
#
# PUBLISHED UP FRONT, ON PURPOSE.  The scout report's §5.2 requires it: a
# benchmark that scores CWE agreement without saying which CWEs it considers
# equivalent has an unauditable dial in it, and every argument about the
# result becomes an argument about that dial.  This file is that dial, in the
# open, and `bench/score.sh` prints which class each category resolved to.
#
# FORMAT.  One class per line, space-separated bare CWE numbers.  `#` starts a
# whole-line comment.  Order within a line is irrelevant; the scorer builds a
# canonical representative per class.
#
# A CWE THAT APPEARS IN NO LINE IS ITS OWN SINGLETON CLASS.  That is the
# conservative default and it is deliberate: widening a class can only turn a
# strict miss into a strict hit, so an over-generous table inflates strict
# recall for every tool and silently converts the strict/loose agreement check
# - the thing that proves the ranking is not a scoring artifact - into a
# tautology.  Adding a class is therefore a decision to be argued in this
# file, not a convenience.
#
# PROVENANCE.  These are the classes the scout report names as the ones the
# official OWASP Benchmark scorer uses (data/scoursh-bench/report.md §3.1).
# Every category the OWASP Benchmark corpus labels resolves through them:
#
#     pathtraver 22   sqli 89   cmdi 78    ldapi 90   xss 79
#     crypto 327      hash 328  weakrand 330
#     trustbound 501  securecookie 614     xpathi 643
#
# so the ones with no line below (89, 90, 79, 501, 614, 643) are singletons by
# the rule above, and are singletons because no published equivalence for them
# was cited - not because none could exist.

# Weak or broken cryptography, and weak hashing.  327 (broken algorithm), 326
# (inadequate key strength), 328 (weak hash), 310 (the retired parent), 916
# (weak password hash).  A tool reporting any of these about a case labelled
# with another is describing the same defect.
326 327 328 310 916

# Insufficient randomness.  330 (the parent) and 338 (a cryptographically
# weak PRNG).
330 338

# Path traversal.  22 (the parent), 23 (relative), 36 (absolute).
22 23 36

# OS command injection.  78 (argument injection into a command) and 77 (the
# broader command-injection parent).
78 77
